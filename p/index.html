<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Messenger Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="reg-screen" class="screen full-white">
        <div class="auth-box">
            <div class="login-avatar">
                <svg viewBox="0 0 24 24" fill="none" stroke="#075e54" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
            <input type="text" id="user-name" placeholder="Your Name">
            <input type="number" id="user-phone" placeholder="Mobile Number">
            <button class="primary-btn" onclick="registerUser()">Save Profile</button>
        </div>
    </div>

    <div id="home-screen" class="screen hidden">
        <header class="main-header">
            <div class="header-left">
                <div class="avatar-small">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </div>
                <div class="header-user">
                    <strong id="my-name-display">...</strong>
                    <span id="my-phone-display">...</span>
                </div>
            </div>
            <div class="header-right">
                <button class="icon-btn" onclick="toggleMenu('main-menu', event)">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
                </button>
                <div id="main-menu" class="menu-content hidden">
                    <div onclick="logout()">Log Out</div>
                    <div onclick="clearAllData()">Clear All Data</div>
                </div>
            </div>
        </header>
        <div id="friend-list" class="list-container"></div>
        <button class="fab" onclick="showAddSheet(false)">+</button>
    </div>

    <div id="add-sheet" class="bottom-sheet hidden">
        <div class="sheet-content">
            <h3 id="sheet-title">Add New Friend</h3>
            <input type="text" id="new-friend-name" placeholder="Friend Name">
            <input type="number" id="new-friend-phone" placeholder="Mobile Number">
            <div class="sheet-actions">
                <button class="save-btn" onclick="saveFriend()">Save</button>
                <button class="cancel-btn" onclick="hideAddSheet()">Cancel</button>
            </div>
        </div>
    </div>

    <div id="chat-screen" class="screen hidden">
        <header class="chat-header">
            <div class="chat-header-left">
                <button class="back-btn" onclick="showHome()">←</button>
                <div id="friend-initial" class="avatar-circle-small">?</div>
                <div class="header-user">
                    <strong id="chat-with-name">...</strong>
                    <span id="chat-with-status">Checking...</span>
                </div>
            </div>
            <div class="header-right">
                <button class="icon-btn" onclick="toggleMenu('chat-menu', event)">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
                </button>
                <div id="chat-menu" class="menu-content hidden">
                    <div onclick="showAddSheet(true)">Edit Profile</div>
                    <div onclick="clearChat()">Clear Chat</div>
                    <div onclick="deleteFriend()">Delete Friend</div>
                </div>
            </div>
        </header>
        <div id="chat-messages" class="chat-area"></div>
        <div class="chat-footer">
            <label for="file-input" class="file-btn">📎</label>
            <input type="file" id="file-input" hidden onchange="sendFile(this)">
            <input type="text" id="msg-input" placeholder="Type a message...">
            <button class="send-btn" onclick="sendTextMessage()">➤</button>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
