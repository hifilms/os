<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private Audio Call</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="launch-screen" class="screen active">
        <div class="setup-container">
            <h2>স্বাগতম</h2>
            <p>আপনার প্রোফাইল সেটআপ করুন</p>
            <input type="text" id="user-name-input" placeholder="আপনার নাম">
            <input type="number" id="user-phone-input" placeholder="মোবাইল নাম্বার">
            <button id="save-profile-btn">সেভ করুন</button>
        </div>
    </div>

    <div id="home-screen" class="screen">
        <header>
            <div class="profile-section">
                <div class="header-avatar" id="my-avatar-icon">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </div>
                <div class="user-info">
                    <h3 id="display-name">User Name</h3>
                    <p id="display-number">017XXXXXXXX</p>
                </div>
            </div>
            <div class="header-menu" id="main-settings-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
            </div>
        </header>

        <div class="search-bar">
            <input type="text" id="contact-search" placeholder="নাম বা নাম্বার দিয়ে খুঁজুন...">
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="all">All</button>
            <button class="tab-btn" data-tab="unknown">Unknown</button>
            <button class="tab-btn" data-tab="blocked">Blocked</button>
        </div>

        <div id="contact-list" class="list-container">
            </div>

        <button id="add-contact-btn" class="fab">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
    </div>

    <div id="bottom-sheet-overlay" class="overlay"></div>
    <div id="bottom-sheet" class="bottom-sheet">
        <div class="sheet-handle"></div>
        <div id="sheet-content">
            </div>
    </div>

    <div id="call-screen" class="screen call-ui">
        <div class="call-top">
            <div class="call-avatar" id="caller-avatar">A</div>
            <h2 id="call-name">Unknown</h2>
            <p id="call-number">01XXXXXXXXX</p>
            <span id="call-status">Calling...</span>
        </div>
        <div class="call-bottom">
            <button id="mute-btn" class="call-opt">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
            </button>
            <button id="hangup-btn" class="call-opt hangup">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"></path></svg>
            </button>
            <button id="speaker-btn" class="call-opt">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
            </button>
        </div>
    </div>

    <div id="incoming-popup" class="incoming-popup">
        <div class="incoming-info">
            <h4 id="in-caller-name">Unknown</h4>
            <p id="in-caller-number">01XXXXXXXXX</p>
        </div>
        <div class="incoming-actions">
            <button id="accept-call" class="accept-btn">Accept</button>
            <button id="decline-call" class="decline-btn">Decline</button>
        </div>
    </div>

    <div id="no-internet" class="no-internet">No Internet Connection</div>

    <audio id="remote-audio" autoplay></audio>
    <audio id="ringtone" src="ringtone.mp3" loop></audio>

    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="storage.js"></script>
    <script src="ui-controller.js"></script>
    <script src="peer-logic.js"></script>
    <script src="app.js"></script>
</body>
</html>
