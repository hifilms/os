<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body, html { 
            margin: 0; padding: 0; 
            width: 100vw; height: 100vh; 
            background: #000; overflow: hidden; 
        }
        #video-container {
            width: 100vw; height: 100vh;
            position: relative;
        }
        iframe { 
            width: 100% !important; height: 100% !important; 
            border: none; position: absolute; top: 0; left: 0;
        }
    </style>
</head>
<body>
    <div id="video-container"></div>
    <script>
    const vId = new URLSearchParams(window.location.search).get('v');
    if (vId) {
        // 'preload' নিশ্চিত করতে এবং অপ্রয়োজনীয় এলিমেন্ট বাদ দিতে
        const iframe = document.createElement('iframe');
        iframe.src = `https://www.youtube.com/embed/${vId}?autoplay=1&rel=0&modestbranding=1&fs=1&widget_referrer=${window.location.origin}`;
        iframe.setAttribute('allow', 'autoplay; fullscreen');
        iframe.setAttribute('allowfullscreen', 'true');
        document.body.appendChild(iframe);
    }
</script>
</body>
</html>
