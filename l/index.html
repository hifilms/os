<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WhatsApp P2P</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- Login Overlay -->
        <div id="login-overlay" class="overlay">
            <div class="login-box">
                <div class="avatar-upload-container">
                    <label for="login-avatar-input" class="avatar-preview-label">
                        <div class="avatar-large">
                            <img id="login-avatar-preview"
                                src="https://upload.wikimedia.org/wikipedia/commons/9/93/Google_Contacts_icon.svg">
                        </div>
                        <div class="upload-badge">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path
                                    d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z">
                                </path>
                                <circle cx="12" cy="13" r="4"></circle>
                            </svg>
                        </div>
                    </label>
                    <input type="file" id="login-avatar-input" accept="image/*" style="display: none;">
                </div>
                <input type="text" id="login-mobile" placeholder="Your Mobile Number" inputmode="numeric"
                    oninput="this.value = this.value.replace(/[^0-9]/g, ''); if(this.value.length === 0) { this.classList.remove('validation-error', 'validation-success'); } else if(this.value.length >= 8) { this.classList.remove('validation-error'); this.classList.add('validation-success'); } else { this.classList.remove('validation-success'); this.classList.add('validation-error'); }">
                <input type="text" id="login-name" placeholder="Your Display Name">
                <button id="btn-login" class="primary-btn">Get Started</button>
            </div>
        </div>

        <div class="main-app" id="main-app">
            <!-- Sidebar: Contacts -->
            <div class="sidebar" id="sidebar">
                <div class="header">
                    <div class="header-left" id="btn-profile-header" style="cursor: pointer;">
                        <div class="avatar">
                            <img id="my-avatar"
                                src="https://upload.wikimedia.org/wikipedia/commons/9/93/Google_Contacts_icon.svg">
                        </div>
                        <div class="user-details-header">
                            <div id="my-name" style="font-size: 16px; font-weight: 600;">Me</div>
                            <div id="my-mobile" style="font-size: 12px; color: var(--text-secondary);"></div>
                        </div>
                    </div>
                    <div class="header-right">
                        <button class="icon-btn" id="btn-add-contact">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </button>
                        <div class="menu-container">
                            <button class="icon-btn" id="btn-main-menu">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <circle cx="12" cy="12" r="1"></circle>
                                    <circle cx="12" cy="5" r="1"></circle>
                                    <circle cx="12" cy="19" r="1"></circle>
                                </svg>
                            </button>
                            <div class="dropdown-menu" id="main-menu">
                                <button id="btn-toggle-theme">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                                    </svg>
                                    <span>Dark Mode</span>
                                </button>
                                <button id="btn-show-blacklist">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                                    </svg>
                                    <span>Blacklist</span>
                                </button>
                                <button id="btn-logout" style="color: #ff5e5e;">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                        <polyline points="16 17 21 12 16 7"></polyline>
                                        <line x1="21" y1="12" x2="9" y2="12"></line>
                                    </svg>
                                    <span>Logout</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="search-container">
                    <div class="search-box">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="contact-search" placeholder="Search or start a new chat">
                    </div>
                </div>
                <div class="contact-list" id="contact-list"></div>
            </div>

            <!-- Chat Screen -->
            <div class="chat-area" id="chat-area">
                <div class="chat-header">
                    <div class="chat-header-left">
                        <button class="icon-btn" id="btn-back">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5">
                                <line x1="19" y1="12" x2="5" y2="12"></line>
                                <polyline points="12 19 5 12 12 5"></polyline>
                            </svg>
                        </button>
                        <div class="avatar">
                            <img id="header-avatar"
                                src="https://upload.wikimedia.org/wikipedia/commons/9/93/Google_Contacts_icon.svg">
                        </div>
                        <div class="chat-info">
                            <span class="chat-name" id="chat-name">User</span>
                            <div class="chat-status" id="chat-status">offline</div>
                        </div>
                    </div>
                    <div class="menu-container">
                        <button class="icon-btn" id="btn-chat-menu">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <circle cx="12" cy="12" r="1"></circle>
                                <circle cx="12" cy="5" r="1"></circle>
                                <circle cx="12" cy="19" r="1"></circle>
                            </svg>
                        </button>
                        <div class="dropdown-menu" id="chat-menu">
                            <button id="btn-chat-rename">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                </svg>
                                <span>Rename</span>
                            </button>
                            <button id="btn-chat-clear">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path
                                        d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                                    </path>
                                    <line x1="10" y1="11" x2="10" y2="17"></line>
                                    <line x1="14" y1="11" x2="14" y2="17"></line>
                                </svg>
                                <span>Clear Chat</span>
                            </button>
                            <button id="btn-chat-block" style="color: #ff9800;">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                                </svg>
                                <span>Block Contact</span>
                            </button>
                            <button id="btn-chat-delete" style="color: #ff5e5e;">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                    <line x1="15" y1="13" x2="21" y2="19"></line>
                                    <line x1="21" y1="13" x2="15" y2="19"></line>
                                </svg>
                                <span>Delete Contact</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="chat-messages" id="chat-messages"></div>

                <div class="chat-input-area">
                    <div class="input-capsule">
                        <button class="icon-btn" id="btn-attach-menu">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path
                                    d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48">
                                </path>
                            </svg>
                        </button>
                        <input type="file" id="file-input" style="display: none;">
                        <div id="recording-status"
                            style="display: none; align-items: center; gap: 8px; flex: 1; color: #ff5e5e; font-weight: 600; font-size: 14px; padding: 12px 0;">
                            <div class="recording-pulse"></div>
                            <span id="recording-timer">0:00</span>
                        </div>
                        <textarea id="msg-input" placeholder="Type a message" rows="1"></textarea>
                    </div>
                    <button class="icon-btn" id="btn-record">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                            <line x1="8" y1="23" x2="16" y2="23"></line>
                        </svg>
                    </button>
                    <button class="icon-btn" id="btn-send" style="display: none;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="sheet-edit-profile" class="modal">
        <div class="modal-content">
            <div class="sheet-handle"></div>
            <div class="avatar-upload-container">
                <label for="edit-avatar-input" class="avatar-preview-label">
                    <div class="avatar-large">
                        <img id="edit-avatar-preview"
                            src="https://upload.wikimedia.org/wikipedia/commons/9/93/Google_Contacts_icon.svg">
                    </div>
                    <div class="upload-badge">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z">
                            </path>
                            <circle cx="12" cy="13" r="4"></circle>
                        </svg>
                    </div>
                </label>
                <input type="file" id="edit-avatar-input" accept="image/*" style="display: none;">
            </div>
            <div style="text-align: center; margin-bottom: 24px;">
                <div id="edit-mobile-display"
                    style="font-size: 14px; color: var(--text-secondary); margin-bottom: 15px;">Mobile</div>
                <input type="text" id="edit-name-input" placeholder="Your Name"
                    style="text-align: center; font-size: 18px; font-weight: 500;">
            </div>
            <div class="sheet-footer"
                style="justify-content: space-around; border-top: 1px solid var(--border-color); padding-top: 20px;">
                <span onclick="closeSheets()"
                    style="color: #ff5e5e; cursor: pointer; font-weight: 600; font-size: 16px;">Cancel</span>
                <span id="btn-save-profile"
                    style="color: var(--primary-color); cursor: pointer; font-weight: 600; font-size: 16px;">Save</span>
            </div>
        </div>
    </div>


    <div id="sheet-add-contact" class="modal">
        <div class="modal-content">
            <div class="sheet-handle"></div>
            <h3>Add New Contact</h3>
            <input type="text" id="contact-mobile" placeholder="Mobile Number (Min. 8 digits)" inputmode="numeric"
                oninput="this.value = this.value.replace(/[^0-9]/g, ''); if(this.value.length === 0) { this.classList.remove('validation-error', 'validation-success'); } else if(this.value.length >= 8) { this.classList.remove('validation-error'); this.classList.add('validation-success'); } else { this.classList.remove('validation-success'); this.classList.add('validation-error'); }">
            <input type="text" id="contact-name" placeholder="Display Name">
            <div class="sheet-footer">
                <button class="sheet-item plain" onclick="closeSheets()">Cancel</button>
                <button class="sheet-item plain" id="btn-save-contact"
                    style="color: var(--primary-color); font-weight: 600;">Add</button>
            </div>
        </div>
    </div>

    <div id="sheet-msg-actions" class="modal">
        <div class="modal-content">
            <div class="sheet-handle"></div>
            <button class="sheet-item" id="sheet-btn-copy">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span>Copy Message</span>
            </button>
            <button class="sheet-item" id="sheet-btn-forward">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 10 20 15 15 20"></polyline>
                    <path d="M4 4v7a4 4 0 0 0 4 4h12"></path>
                </svg>
                <span>Forward Message</span>
            </button>
            <button class="sheet-item danger" id="sheet-btn-delete-msg">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
                <span>Delete for Me</span>
            </button>
        </div>
    </div>

    <div id="sheet-logout" class="modal">
        <div class="modal-content">
            <div class="sheet-handle"></div>
            <h3 style="text-align: center;">Log Out?</h3>
            <div class="sheet-footer">
                <button class="sheet-item plain" onclick="closeSheets()">Cancel</button>
                <button class="sheet-item plain danger" id="btn-confirm-logout">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Logout
                </button>
            </div>
        </div>
    </div>

    <div id="sheet-forward" class="modal">
        <div class="modal-content">
            <div class="sheet-handle"></div>
            <h3>Forward to...</h3>
            <div id="forward-contact-list"></div>
        </div>
    </div>

    <div id="sheet-rename" class="modal">
        <div class="modal-content">
            <div class="sheet-handle"></div>
            <h3>Rename Contact</h3>
            <input type="text" id="rename-input">
            <div class="sheet-footer"
                style="justify-content: space-around; border-top: 1px solid var(--border-color); padding-top: 20px;">
                <span onclick="closeSheets()"
                    style="color: #ff5e5e; cursor: pointer; font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 8px;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                    Cancel
                </span>
                <span id="btn-save-rename"
                    style="color: var(--primary-color); cursor: pointer; font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 8px;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    Save
                </span>
            </div>
        </div>
    </div>

    <div id="sheet-confirm-clear" class="modal">
        <div class="modal-content">
            <div class="sheet-handle"></div>
            <h3>Clear Chat?</h3>
            <div class="sheet-footer">
                <button class="sheet-item plain" onclick="closeSheets()">Cancel</button>
                <button class="sheet-item plain danger" id="btn-clear-confirm">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    Clear
                </button>
            </div>
        </div>
    </div>

    <div id="sheet-confirm-block" class="modal">
        <div class="modal-content">
            <div class="sheet-handle"></div>
            <h3>Block User?</h3>
            <div class="sheet-footer">
                <button class="sheet-item plain" onclick="closeSheets()">Cancel</button>
                <button class="sheet-item plain danger" id="btn-block-confirm">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                    </svg>
                    Block
                </button>
            </div>
        </div>
    </div>

    <div id="sheet-confirm-delete-contact" class="modal">
        <div class="modal-content">
            <div class="sheet-handle"></div>
            <h3>Delete Contact?</h3>
            <div class="sheet-footer">
                <button class="sheet-item plain" onclick="closeSheets()">Cancel</button>
                <button class="sheet-item plain danger" id="btn-delete-contact-confirm">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                        <line x1="15" y1="13" x2="21" y2="19"></line>
                        <line x1="21" y1="13" x2="15" y2="19"></line>
                    </svg>
                    Delete
                </button>
            </div>
        </div>
    </div>

    <div id="sheet-blacklist" class="modal">
        <div class="modal-content">
            <div class="sheet-handle"></div>
            <h3>Blacklist</h3>
            <div id="blacklist-container"></div>
        </div>
    </div>

    <div id="sheet-attachment" class="modal">
        <div class="modal-content" style="padding-bottom: 40px;">
            <div class="sheet-handle"></div>
            <div class="attachment-grid">
                <div class="attach-item" onclick="triggerFileInput('document')">
                    <div class="attach-icon doc"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="white" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                        </svg></div>
                    <span>Document</span>
                </div>
                <div class="attach-item" onclick="triggerFileInput('image')">
                    <div class="attach-icon gallery"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="white" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg></div>
                    <span>Gallery</span>
                </div>
                <div class="attach-item">
                    <div class="attach-icon camera"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="white" stroke-width="2">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z">
                            </path>
                            <circle cx="12" cy="13" r="4"></circle>
                        </svg></div>
                    <span>Camera</span>
                </div>
                <div class="attach-item">
                    <div class="attach-icon audio"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="white" stroke-width="2">
                            <path d="M9 18V5l12-2v13"></path>
                            <circle cx="6" cy="18" r="3"></circle>
                            <circle cx="18" cy="16" r="3"></circle>
                        </svg></div>
                    <span>Audio</span>
                </div>
            </div>
        </div>
    </div>

    <!-- File Send Preview Modal -->
    <div id="sheet-file-preview" class="modal">
        <div class="modal-content"
            style="height: 100vh; max-height: 100vh; border-radius: 0; padding: 0; background: #000;">
            <div class="preview-header">
                <button class="icon-btn" onclick="closeSheets()" style="color: white; transform: rotate(180deg);"><svg
                        width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg></button>
                <span id="preview-filename" style="color: white; flex: 1; margin-left:12px;">File Preview</span>
            </div>
            <div id="file-preview-content"
                style="flex: 1; display:flex; align-items:center; justify-content:center; overflow:hidden;">
                <!-- Preview image or doc icon goes here -->
            </div>
            <div class="preview-footer"
                style="padding: 16px; background: rgba(0,0,0,0.5); display:flex; gap: 12px; align-items: center;">
                <div class="input-capsule" style="background: rgba(255,255,255,0.1); border:none;">
                    <textarea id="file-caption" placeholder="Add a caption..." rows="1"
                        style="color: white; font-size: 15px; padding: 12px;"></textarea>
                </div>
                <button class="icon-btn" id="btn-send-file" style="background: var(--primary-color); color: white;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
