<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        #player { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* আমাদের কাস্টম বারগুলো - এগুলোর মাঝখানে কোনো লেয়ার নেই */
        .custom-ui { position: absolute; z-index: 10; opacity: 0; transition: 0.4s; pointer-events: auto; }
        .show { opacity: 1; }

        /* টাইম: বাম দিকে একদম উপরে */
        #time-info { top: 10px; left: 15px; color: #fff; font-family: sans-serif; font-size: 14px; text-shadow: 1px 1px 2px #000; }

        /* ফুলস্ক্রিন: ডান দিকে একদম উপরে */
        #fs-btn { top: 10px; right: 15px; background: none; border: none; cursor: pointer; }
        #fs-btn svg { width: 25px; height: 25px; fill: white; }

        /* স্লাইডার বার: একদম নিচের সাথে সেঁটে থাকবে */
        #bottom-bar { bottom: 0; left: 0; width: 100%; height: 5px; padding: 0; margin: 0; display: flex; }
        #seek-bar { width: 100%; height: 5px; cursor: pointer; accent-color: red; margin: 0; padding: 0; border: none; outline: none; }
    </style>
</head>
<body>

    <div id="player"></div>

    <div id="time-info" class="custom-ui">0:00 / 0:00</div>
    
    <button id="fs-btn" class="custom-ui" onclick="toggleFS()">
        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    </button>

    <div id="bottom-bar" class="custom-ui">
        <input type="range" id="seek-bar" value="0" step="0.1">
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player, hideTimer;
        const uiElements = document.querySelectorAll('.custom-ui');

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'qbN7DtPAKQo',
                playerVars: { 'controls': 0, 'autoplay': 1, 'rel': 0, 'enablejsapi': 1 },
                events: { 'onReady': () => { setInterval(update, 500); showUI(); } }
            });
        }

        // মাউস নড়ালে কন্ট্রোল দেখাবে
        window.addEventListener('mousemove', showUI);
        window.addEventListener('touchstart', showUI);

        function showUI() {
            uiElements.forEach(el => el.classList.add('show'));
            clearTimeout(hideTimer);
            hideTimer = setTimeout(() => {
                if(player.getPlayerState() === 1) uiElements.forEach(el => el.classList.remove('show'));
            }, 4000);
        }

        function update() {
            if (player && player.getCurrentTime) {
                let cur = player.getCurrentTime(), dur = player.getDuration();
                document.getElementById('time-info').innerText = format(cur) + " / " + format(dur);
                document.getElementById('seek-bar').value = (cur / dur) * 100;
            }
        }

        function format(s) {
            let m = Math.floor(s / 60), sec = Math.floor(s % 60);
            return m + ":" + (sec < 10 ? '0' : '') + sec;
        }

        document.getElementById('seek-bar').oninput = function() {
            player.seekTo(player.getDuration() * (this.value / 100));
        };

        function toggleFS() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }
    </script>
</body>
</html>
