<!DOCTYPE html>
<html lang="bn">
<head>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #player { width: 100vw; height: 100vh; }
        
        /* কন্ট্রোল বার - শুরুতে নিচে লুকানো থাকবে */
        .bar { 
            position: absolute; bottom: 0; width: 100%; 
            background: linear-gradient(transparent, rgba(0,0,0,0.9)); 
            padding: 20px; display: flex; align-items: center; gap: 15px; 
            z-index: 100; opacity: 0; transform: translateY(100%);
            transition: all 0.4s ease; box-sizing: border-box;
        }
        
        /* এই ক্লাস যোগ হলে বার দেখা যাবে */
        .bar.show { opacity: 1; transform: translateY(0); }
        
        #seek { flex-grow: 1; accent-color: red; cursor: pointer; height: 5px; }
        span { color: white; font-size: 14px; font-weight: bold; min-width: 45px; }
        
        /* নিচের ডিটেকশন এরিয়া - এখানে মাউস আনলেই বার দেখাবে */
        #hover-zone {
            position: absolute; bottom: 0; width: 100%; height: 80px; z-index: 50;
        }
    </style>
</head>
<body>

    <div id="player"></div>
    
    <div id="hover-zone"></div>

    <div class="bar" id="ctrl-bar">
        <span id="cur">0:00</span>
        <input type="range" id="seek" value="0" step="0.1">
        <span id="dur">0:00</span>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player, timer;
        const bar = document.getElementById('ctrl-bar');
        const hoverZone = document.getElementById('hover-zone');

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'dQw4w9WgXcQ',
                playerVars: { 'controls': 0, 'autoplay': 1, 'rel': 0, 'enablejsapi': 1 },
                events: { 'onReady': () => setInterval(update, 500) }
            });
        }

        // মাউস এরিয়াতে আনলে বার শো করবে
        hoverZone.addEventListener('mouseenter', () => {
            clearTimeout(timer);
            bar.classList.add('show');
        });

        // মাউস বার থেকে সরিয়ে নিলে ৪ সেকেন্ড পর হাইড হবে
        bar.addEventListener('mouseleave', () => {
            timer = setTimeout(() => {
                bar.classList.remove('show');
            }, 4000); // ৪ সেকেন্ড পর হাইড
        });

        function update() {
            if (player && player.getCurrentTime) {
                let c = player.getCurrentTime(), d = player.getDuration();
                document.getElementById('cur').innerText = format(c);
                document.getElementById('dur').innerText = format(d);
                document.getElementById('seek').value = (c / d) * 100;
            }
        }

        function format(s) {
            let m = Math.floor(s / 60), sec = Math.floor(s % 60);
            return m + ":" + (sec < 10 ? '0' : '') + sec;
        }

        document.getElementById('seek').oninput = function() {
            player.seekTo(player.getDuration() * (this.value / 100));
        };
    </script>
</body>
</html>
