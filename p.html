<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi Music - Pro Player</title>
    <style>
        /* ১. লেআউট ও ডিজাইন */
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #000;
            overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #player-wrapper {
            position: relative;
            width: 100vw; height: 100vh;
            cursor: none; /* কন্ট্রোল হাইড থাকলে মাউস দেখাবে না */
        }

        #player-wrapper.show-controls { cursor: default; }

        #youtube-frame {
            width: 100%; height: 100%;
            pointer-events: none; /* ইউটিউব ব্র্যান্ডিং ক্লিক বন্ধ */
        }

        /* ২. ইন্টারেক্টিভ লেয়ার (প্লে/পজ করার জন্য) */
        #interaction-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
        }

        /* ৩. মাঝখানের প্লে/পজ আইকন এনিমেশন */
        #status-icon {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            width: 80px; height: 80px;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; z-index: 15;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #status-icon.animate {
            opacity: 1; transform: translate(-50%, -50%) scale(1.1);
        }

        #status-icon svg { width: 40px; height: 40px; fill: white; }

        /* ৪. এক লাইনের আধুনিক কন্ট্রোল বার */
        .bottom-controls {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%;
            background: linear-gradient(transparent, rgba(0,0,0,0.95));
            padding: 35px 20px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-sizing: border-box;
            z-index: 20;
            opacity: 0;
            transform: translateY(100%);
            transition: all 0.5s ease;
        }

        #player-wrapper.show-controls .bottom-controls {
            opacity: 1; transform: translateY(0);
        }

        .time-text {
            color: #fff; /* সাদা টাইম টেক্সট */
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            min-width: 45px;
        }

        #seek-bar {
            flex-grow: 1;
            height: 5px;
            cursor: pointer;
            accent-color: #ff0000; /* লাল স্লাইডার */
            outline: none;
        }

        .fs-btn {
            background: none; border: none;
            cursor: pointer; display: flex; align-items: center;
            padding: 5px;
        }

        .fs-btn svg { width: 22px; height: 22px; fill: #fff; }
    </style>
</head>
<body>

    <div id="player-wrapper" class="show-controls">
        <div id="status-icon">
            <svg id="icon-svg" viewBox="0 0 24 24"></svg>
        </div>

        <div id="interaction-layer"></div>
        
        <div id="youtube-frame"></div>

        <div class="bottom-controls">
            <span id="current-time" class="time-text">0:00</span>
            
            <input type="range" id="seek-bar" value="0" max="100" step="0.1">
            
            <span id="total-duration" class="time-text">0:00</span>
            
            <button class="fs-btn" id="fs-toggle">
                <svg id="fs-icon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            </button>
        </div>
    </div>

    <script>
        let player, hideTimeout;
        const wrapper = document.getElementById('player-wrapper');
        const statusIcon = document.getElementById('status-icon');
        const iconSvg = document.getElementById('icon-svg');
        const interactionLayer = document.getElementById('interaction-layer');

        // ইউটিউব এপিআই লোড
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            const urlParams = new URLSearchParams(window.location.search);
            const videoId = urlParams.get('id') || 'dQw4w9WgXcQ'; // ইউআরএল-এ আইডি না থাকলে ডেমো

            player = new YT.Player('youtube-frame', {
                videoId: videoId,
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'modestbranding': 1,
                    'rel': 0,
                    'playsinline': 1,
                    'enablejsapi': 1,
                    'iv_load_policy': 3 // সাজেশন কার্ড ইগনোর করার চেষ্টা
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            event.target.playVideo();
            setInterval(updateUI, 500);
            resetHideTimer();
        }

        function onPlayerStateChange(event) {
            resetHideTimer();

            // বিজ্ঞাপন (Ad) চেক করা
            if (player.getAdState() === 1) {
                // অ্যাড চললে আমাদের লেয়ার বন্ধ হবে যাতে Skip Ad বাটনে ক্লিক করা যায়
                interactionLayer.style.pointerEvents = 'none';
                wrapper.classList.remove('show-controls');
            } else {
                // মূল ভিডিওতে আমাদের লেয়ার ফিরে আসবে (সাজেশন ব্লক করবে)
                interactionLayer.style.pointerEvents = 'auto';
                
                // ভিডিও শেষ হলে অটো-প্লে নেক্সট (লজিক পরে যোগ হবে)
                if (event.data === YT.PlayerState.ENDED) {
                    console.log("Next video loading...");
                }
            }
        }

        // কন্ট্রোল বার অটো-হাইড ও স্লাইড লজিক
        function resetHideTimer() {
            clearTimeout(hideTimeout);
            wrapper.classList.add('show-controls');

            // ভিডিও পজ থাকলে হাইড হবে না
            if (player && player.getPlayerState() === YT.PlayerState.PLAYING) {
                hideTimeout = setTimeout(() => {
                    wrapper.classList.remove('show-controls');
                }, 3000); 
            }
        }

        // টাচ বা মাউস মুভ করলে কন্ট্রোল বার দেখাবে
        wrapper.addEventListener('mousemove', resetHideTimer);
        wrapper.addEventListener('touchstart', resetHideTimer);

        // ক্লিক করে প্লে/পজ এবং আইকন এনিমেশন
        interactionLayer.addEventListener('click', () => {
            const state = player.getPlayerState();
            if (state === YT.PlayerState.PLAYING) {
                player.pauseVideo();
                showStatusIcon('pause');
            } else {
                player.playVideo();
                showStatusIcon('play');
            }
            resetHideTimer();
        });

        function showStatusIcon(type) {
            iconSvg.innerHTML = (type === 'play') 
                ? '<path d="M8 5v14l11-7z"/>' 
                : '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            
            statusIcon.classList.add('animate');
            setTimeout(() => statusIcon.classList.remove('animate'), 400);
        }

        function updateUI() {
            if (player && player.getCurrentTime) {
                const cur = player.getCurrentTime();
                const dur = player.getDuration();
                document.getElementById('current-time').innerText = formatTime(cur);
                document.getElementById('total-duration').innerText = formatTime(dur);
                document.getElementById('seek-bar').value = (cur / dur) * 100;
            }
        }

        function formatTime(s) {
            let m = Math.floor(s / 60);
            let sec = Math.floor(s % 60);
            return m + ":" + (sec < 10 ? '0' : '') + sec;
        }

        // স্লাইডার টেনে ভিডিও নিয়ন্ত্রণ
        document.getElementById('seek-bar').addEventListener('input', function() {
            player.seekTo(player.getDuration() * (this.value / 100));
        });

        // ফুলস্ক্রিন টগল
        document.getElementById('fs-toggle').addEventListener('click', () => {
            const fsIcon = document.getElementById('fs-icon');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                fsIcon.innerHTML = '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>';
            } else {
                document.exitFullscreen();
                fsIcon.innerHTML = '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>';
            }
        });
    </script>
</body>
</html>
