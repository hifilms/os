<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Hub Pro</title>
    
    <link rel="preconnect" href="https://www.youtube.com">
    <link rel="dns-prefetch" href="https://img.youtube.com">

    <style>
        :root { --bg: #ffffff; --text: #333; --header-h: 50px; --accent: #f2f2f2; }
        * { box-sizing: border-box; -ms-overflow-style: none; scrollbar-width: none; }
        *::-webkit-scrollbar { display: none; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
        
        /* হেডার: আপনার পাঠানো পুরনো ফাইল থেকে নেওয়া গঠন */
        header { 
            display: flex; align-items: center; height: var(--header-h); padding: 0 15px; 
            background: #fff; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 1000; 
            transition: transform 0.3s ease;
        }
        header.hide { transform: translateY(-100%); }
        .logo { width: 32px; height: 32px; margin-right: 12px; } 
        .app-name { font-size: 18px; font-weight: 700; flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .back-btn { cursor: pointer; width: 24px; height: 24px; margin-right: 15px; fill: #333; display: none; }
        .menu-dots { cursor: pointer; width: 24px; fill: #333; }

        /* বাকি সব নতুন স্টাইল অক্ষুণ্ণ রাখা হয়েছে */
        .page { display: none; width: 100%; min-height: 100vh; }
        .active { display: block; }

        @keyframes shimmer { 0% { background-position: -468px 0; } 100% { background-position: 468px 0; } }
        .skeleton { background: #f6f7f8; background-image: linear-gradient(to right, #f6f7f8 0%, #edeef1 20%, #f6f7f8 40%, #f6f7f8 100%); background-repeat: no-repeat; background-size: 800px 100%; animation: shimmer 1.5s infinite linear; border-radius: 8px; }

        .slider-container { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; }
        .slide { min-width: 100%; height: 210px; position: relative; scroll-snap-align: center; cursor: pointer; overflow: hidden; }
        .slide img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s; }
        .slide img.loaded { opacity: 1; }
        .slide-info { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.8)); padding: 25px 15px 10px; color: #fff; }
        
        .tab-wrapper { position: sticky; top: var(--header-h); background: #fff; z-index: 40; padding: 15px 0; overflow-x: auto; white-space: nowrap; display: flex; gap: 10px; border-bottom: 5px solid #f4f4f4; }
        .tab-wrapper::before, .tab-wrapper::after { content: ''; min-width: 5px; }
        .tab-item { padding: 6px 18px; background: transparent; border: 1px solid #ddd; border-radius: 25px; font-size: 13px; font-weight: 600; color: #666; cursor: pointer; }
        .tab-item.active { background: #f9f9f9; border-color: #000; color: #000; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 20px 15px; }
        .card { position: relative; aspect-ratio: 16/10; border-radius: 12px; overflow: hidden; border: 1px solid #eee; background: #eee; }
        .card img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s; }
        .card img.loaded { opacity: 1; }
        .card-label { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.6); color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 10px; }

        .sticky-wrapper { position: sticky; top: 0; z-index: 50; background: #fff; transition: top 0.3s ease; }
        .player-box { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; }
        #player-container { width: 100%; height: 100%; }
        #player-container iframe { width: 100%; height: 100%; border: none; }
        
        .offline-ui { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; color: #fff; display: none; z-index: 10; }
        .offline-ui svg { width: 40px; height: 40px; animation: rotate 1s linear infinite; margin-bottom: 10px; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .video-details { padding: 12px 15px; border-bottom: 5px solid #f4f4f4; background: #fff; }
        .list-container { padding: 10px 15px; }
        .video-item { display: flex; gap: 12px; margin-bottom: 12px; cursor: pointer; padding: 8px; border-radius: 8px; }
        .video-item.playing { background: var(--accent); } 
        .thumb-box { width: 120px; min-width: 120px; aspect-ratio: 16/9; border-radius: 6px; overflow: hidden; position: relative; background: #eee; }
        .thumb-box img { width: 100%; height: 100%; object-fit: cover; }
        
        /* টাইম ডিউরেশন (dur) */
        .video-time { position: absolute; bottom: 4px; right: 4px; background: rgba(0,0,0,0.85); color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 3px; font-weight: 600; }
        
        .item-title { font-size: 13px; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        #net-alert { position: fixed; bottom: -60px; left: 0; width: 100%; background: #333; color: #fff; text-align: center; padding: 12px 0; transition: 0.4s; font-size: 13px; z-index: 2000; }
        #net-alert.active { bottom: 0; }

        .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; z-index: 3000; }
        .bottom-sheet { position: fixed; bottom: -100%; left: 0; width: 100%; background: #fff; border-radius: 15px 15px 0 0; transition: 0.4s; z-index: 3001; padding: 20px; }
        .bottom-sheet.open { bottom: 0; }
        .sheet-item { padding: 15px 0; border-bottom: 1px solid #eee; font-size: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <header id="main-header">
        <svg id="main-back" class="back-btn" onclick="window.history.back()" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        <img id="main-logo" src="https://cdn-icons-png.flaticon.com/512/5351/5351486.png" class="logo">
        <div class="app-name" id="header-text">SPORTS HUB</div>
        <svg class="menu-dots" onclick="toggleSheet(true)" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
    </header>

    <div id="home-page" class="page active">
        <div class="slider-container" id="slider">
            <div class="slide skeleton"></div>
        </div>
        <div class="tab-wrapper" id="tab-bar"></div>
        <div class="grid" id="category-grid"></div>
    </div>

    <div id="view-page" class="page">
        <div class="sticky-wrapper" id="player-sticky">
            <div class="player-box">
                <div id="player-container"></div>
                <div id="offline-ui" class="offline-ui">
                    <svg viewBox="0 0 50 50" style="fill:none; stroke:#fff; stroke-width:3; stroke-linecap:round; stroke-dasharray:40,100;"><circle cx="25" cy="25" r="20"/></svg>
                    <span>Loading...</span>
                </div>
            </div>
            <div class="video-details">
                <b id="v-title" style="display:block; font-size:15px; margin-bottom:4px;"></b>
                <small id="v-meta" style="color:#666;"></small>
            </div>
        </div>
        <div class="list-container" id="video-list"></div>
    </div>

    <div id="net-alert">No Internet Connection</div>

    <div class="sheet-overlay" id="overlay" onclick="toggleSheet(false)"></div>
    <div class="bottom-sheet" id="sheet">
        <div style="width:30px; height:4px; background:#ddd; margin:0 auto 15px; border-radius:10px;"></div>
        <div class="sheet-item">Rate App</div>
        <div class="sheet-item">Share App</div>
        <div class="sheet-item" style="border:none;" onclick="toggleSheet(false)">Close</div>
    </div>

    <script>
        let globalData = null;
        let autoScrollInterval = null;
        let lastScrollTop = 0;
        const REMOTE_PLAYER_URL = "player.html"; 

        const onImgLoad = (el) => el.classList.add('loaded');

        // হিস্ট্রি ব্যাক হ্যান্ডলিং (পুরনো ফাইল থেকে নেওয়া)
        window.onpopstate = function() {
            showHome();
        };

        window.addEventListener('online', () => document.getElementById('net-alert').classList.remove('active'));
        window.addEventListener('offline', () => document.getElementById('net-alert').classList.add('active'));

        function showHome() {
            document.getElementById('view-page').classList.remove('active');
            document.getElementById('home-page').classList.add('active');
            
            // পুরনো ফাইলের লজিক: লোগো শো, ব্যাক হাইড
            document.getElementById('main-back').style.display = 'none';
            document.getElementById('main-logo').style.display = 'block';
            
            document.getElementById('header-text').innerText = 'SPORTS HUB';
            document.getElementById('player-container').innerHTML = ""; 
            startAutoScroll();
        }

        function showView(leagueId) {
            const league = globalData.l.find(x => x.id === leagueId);
            if(!league) return;

            window.history.pushState({view: 'player'}, "");

            clearInterval(autoScrollInterval);
            document.getElementById('home-page').classList.remove('active');
            document.getElementById('view-page').classList.add('active');
            
            // পুরনো ফাইলের লজিক: ব্যাক শো, লোগো হাইড
            document.getElementById('main-back').style.display = 'block';
            document.getElementById('main-logo').style.display = 'none';
            
            document.getElementById('header-text').innerText = league.n;
            renderPlayer(league);
            window.scrollTo(0,0);
        }

        function renderPlayer(league) {
            const listDiv = document.getElementById('video-list');
            const offUI = document.getElementById('offline-ui');
            listDiv.innerHTML = "";
            
            function play(v, clickedElement) {
                offUI.style.display = 'flex';
                const container = document.getElementById('player-container');
                const videoUrl = REMOTE_PLAYER_URL + "?v=" + v.id + "&autoplay=1";
                
                container.innerHTML = `<iframe src="${videoUrl}" allow="autoplay; fullscreen" allowfullscreen onload="document.getElementById('offline-ui').style.display='none'"></iframe>`;

                document.getElementById('v-title').innerText = v.t;
                document.getElementById('v-meta').innerText = v.m + " | " + v.d;
                document.querySelectorAll('.video-item').forEach(el => el.classList.remove('playing'));
                if(clickedElement) clickedElement.classList.add('playing');
                else if(listDiv.firstChild) listDiv.firstChild.classList.add('playing');
            }

            league.v.forEach((v, index) => {
                let item = document.createElement('div');
                item.className = 'video-item';
                if(index === 0) item.classList.add('playing');
                
                let timeTag = v.dur ? `<div class="video-time">${v.dur}</div>` : '';
                
                item.innerHTML = `<div class="thumb-box">
                                    <img src="https://img.youtube.com/vi/${v.id}/mqdefault.jpg" onload="onImgLoad(this)" loading="lazy">
                                    ${timeTag}
                                  </div>
                                  <div><div class="item-title">${v.t}</div><div style="font-size:11px; color:#888; margin-top:4px;">${v.m} • ${v.d}</div></div>`;
                item.onclick = function() { play(v, item); window.scrollTo({top:0, behavior:'smooth'}); };
                listDiv.appendChild(item);
            });
            play(league.v[0]);
        }

        function loadAppData() {
            fetch('data.json').then(res => res.json()).then(data => {
                globalData = data;
                renderHomeContent(data);
                startAutoScroll();
            });
        }

        function renderHomeContent(data) {
            const slider = document.getElementById('slider');
            const grid = document.getElementById('category-grid');
            const tabBar = document.getElementById('tab-bar');
            slider.innerHTML = ""; grid.innerHTML = ""; tabBar.innerHTML = "";

            // উন্নত Tabs সিস্টেম (নতুন ফাইলের)
            const games = ['All', ...new Set(data.l.map(item => item.g))];
            games.forEach(gameName => {
                if(!gameName) return;
                let tab = document.createElement('div');
                tab.className = 'tab-item' + (gameName === 'All' ? ' active' : '');
                tab.innerText = gameName;
                tab.onclick = () => {
                    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    filterGrid(gameName);
                };
                tabBar.appendChild(tab);
            });

            const filterGrid = (gameName) => {
                grid.innerHTML = "";
                data.l.forEach(league => {
                    if (gameName === 'All' || league.g === gameName) {
                        let c = document.createElement('div'); c.className = 'card';
                        c.innerHTML = `<img src="${league.i}" onload="onImgLoad(this)" loading="lazy"><div class="card-label">${league.n}</div>`;
                        c.onclick = () => showView(league.id);
                        grid.appendChild(c);
                    }
                });
            };

            // Slider
            data.l.forEach(league => {
                let s = document.createElement('div'); s.className = 'slide';
                s.innerHTML = `<img src="https://img.youtube.com/vi/${league.v[0].id}/mqdefault.jpg" onload="onImgLoad(this)"><div class="slide-info"><b>${league.n}</b></div>`;
                s.onclick = () => showView(league.id);
                slider.appendChild(s);
            });

            filterGrid('All');
        }

        function startAutoScroll() {
            const slider = document.getElementById('slider');
            if(autoScrollInterval) clearInterval(autoScrollInterval);
            autoScrollInterval = setInterval(() => {
                if (slider.scrollLeft + slider.offsetWidth >= slider.scrollWidth - 10) slider.scrollTo({left: 0, behavior: 'smooth'});
                else slider.scrollBy({left: window.innerWidth, behavior: 'smooth'});
            }, 5000);
        }

        function toggleSheet(open) {
            document.getElementById('sheet').classList.toggle('open', open);
            document.getElementById('overlay').style.display = open ? 'block' : 'none';
        }

        window.addEventListener('scroll', function() {
            let currentScroll = window.pageYOffset || document.documentElement.scrollTop;
            let header = document.getElementById('main-header');
            if (currentScroll > lastScrollTop && currentScroll > 80) header.classList.add('hide');
            else header.classList.remove('hide');
            lastScrollTop = currentScroll <= 0 ? 0 : currentScroll;
        });

        loadAppData();
    </script>
</body>
</html>
